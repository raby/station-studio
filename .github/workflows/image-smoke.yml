# The Docker image: build it, run it, check it serves (`make image-smoke`),
# and that docker compose publishes it on this computer only.
#
# On every push to main, and on pull requests that change what goes
# into the image (the Dockerfile, the locked dependencies, the
# packaging). Other pull requests skip it: the build takes a few
# minutes, and ci.yml's wheel smoke covers the rest.

name: image smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'player/pyproject.toml'
      - 'server/pyproject.toml'
      - '.github/workflows/image-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke-image:
    name: install smoke (docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make image-smoke
        # GitHub-hosted runners ship docker pre-installed and ready;
        # no daemon setup step needed.
        run: make image-smoke
      - name: docker compose publishes on this computer only
        # The image make image-smoke just built is the one compose names
        # (station-studio:dev), so --no-build. Studio has no login: it
        # must answer at 127.0.0.1 and not at the runner's own address.
        run: |
          trap 'docker compose down -v' EXIT
          docker compose up -d --no-build --wait
          curl -fsS -o /dev/null -w 'HTTP %{http_code} at 127.0.0.1\n' http://127.0.0.1:8001/api/stations
          ip=$(hostname -I | awk '{print $1}')
          if curl -sS -m 5 -o /dev/null "http://$ip:8001/api/stations"; then
            echo "::error::Studio answers at $ip:8001: docker-compose.yml publishes it on every address"
            exit 1
          fi
          echo "Not reachable at $ip:8001, as intended"
