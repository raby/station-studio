# §16.15 c1 — Publish the MkDocs site to GitHub Pages.
#
# Runs on every push to main. Builds in strict mode (broken
# internal links / nav drift fail the run) and pushes the rendered
# `site/` directory to the `gh-pages` branch using the official
# `actions/deploy-pages` flow.
#
# Pre-req (one-time): enable Pages for this repo with source set
# to "GitHub Actions" (Settings → Pages → Build and deployment →
# Source = GitHub Actions). The action below assumes that mode;
# the legacy "Deploy from branch" mode would also work but the
# Actions mode is what configure-pages targets natively.
name: docs

on:
  push:
    branches: [main]
  # Manual re-run hook for cases where Pages broke without a
  # corresponding code change (e.g. a runner image bump).
  workflow_dispatch:

# Required by actions/deploy-pages — only one in-flight deploy at
# a time per environment. Newer pushes cancel older ones to avoid
# stale builds clobbering newer content.
concurrency:
  group: pages
  cancel-in-progress: true

# §16.15 c1-review R2 — workflow-level perms stay at the minimum
# (`contents: read`); the elevated `pages: write` + `id-token:
# write` pair scopes to the deploy job only. The build job does
# checkout + pip install + mkdocs build — a compromised dep
# during that run should NOT inherit pages-write or OIDC-mint
# capability. Matches the per-job scoping pattern in publish.yml.
permissions:
  contents: read

jobs:
  build:
    name: build mkdocs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # §16.15 c1-review R4 — matches publish.yml + ci.yml
          # (3.12 = Dockerfile runtime base). If ci.yml bumps to a
          # newer Python, bump this too in lockstep.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install mkdocs-material
        # Pulling the full dev-deps surface is heavier than the docs
        # build strictly needs, but matches the deps-parity contract
        # (the runtime+dev install path the rest of CI exercises).
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: mkdocs build (strict)
        run: make docs-build
      - name: smoke-check build artifact
        # §16.15 c1-review R10 — fail loud if a future
        # mkdocs-material bump publishes a near-empty / "Page not
        # found" site. Cheap byte-count + content sniff catches
        # blank-template regressions before they hit Pages.
        # §16.15 c4 — also verify the API reference rendered
        # (the swagger plugin's hard-coded SwaggerUIBundle
        # constructor name in the inline script, plus a
        # non-empty `paths` block in the dumped openapi).
        # §16.15 c4-review R3 — assert on `SwaggerUIBundle`
        # (the plugin's hard-coded template constant) rather
        # than `swagger-ui-dist` (a CDN URL path segment that a
        # future plugin minor bump could transparently change
        # without breaking the page).
        run: |
          test -f site/index.html
          [ "$(wc -c < site/index.html)" -gt 5000 ]
          grep -q 'Station Studio' site/index.html
          test -f site/reference/api/index.html
          grep -q 'SwaggerUIBundle' site/reference/api/index.html
          test -f docs/reference/openapi.json
          grep -q '"paths"' docs/reference/openapi.json
          # §16.15 c5 — CLI reference rendered + all invocations
          # (group + every subcommand discovered from cli_main.
          # commands.keys()) made it through.
          # §16.15 c5-review R4 — substring-sentinels (serve +
          # backup) only proved 2 of 7 H2 sections rendered.
          # Count the `<h2 ... id="station-studio` headers
          # (one per --help invocation) and assert >=7 so a
          # silent-skip regression (e.g. a try/except added
          # to _invoke) fails CI.
          test -f site/reference/cli/index.html
          n_cli_sections=$(grep -c 'id="station-studio' site/reference/cli/index.html)
          test "$n_cli_sections" -ge 7 || \
            (echo "CLI page has only $n_cli_sections sections (expected >=7)" && exit 1)
          # §16.15 c6 — Architecture track: 6 curated pages
          # under docs/architecture/ all build. The smoke check
          # asserts each page's index.html exists (mkdocs
          # publishes them as <slug>/index.html).
          test -f site/architecture/index.html
          test -f site/architecture/engine-pipeline/index.html
          test -f site/architecture/trace-versioning/index.html
          test -f site/architecture/sidecar-db-as-truth/index.html
          test -f site/architecture/live-preview/index.html
          test -f site/architecture/test-pyramid/index.html
          test -f site/architecture/migration-policy/index.html
          # §16.15 c6-review R5 — guard against the duplicate-H1
          # bug class. Every published page should have exactly
          # ONE <h1> (axe-core's `page-has-heading-one` rule
          # fails on 0 or >1). Loop every site/**/index.html and
          # assert the count matches.
          for f in $(find site -name index.html); do
            n=$(grep -c '<h1' "$f" || true)
            test "$n" -eq 1 || \
              (echo "$f has $n <h1> tags (expected exactly 1)" && exit 1)
          done
          # §16.15 c7 — branded styling: dark-mode palette toggle
          # + custom 404 + Material radio-tower logo. Smoke
          # checks for each.
          test -f site/404.html
          grep -q 'Switch to dark mode' site/index.html
          grep -q 'Switch to light mode' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Elevated perms scoped to the deploy job only.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
