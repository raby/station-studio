# Station Player downloads for people without a terminal: a Mac .dmg
# (Apple Silicon and Intel) and a Windows setup .exe, each carrying its
# own Python (PyInstaller; see player/packaging/station-player.spec).
#
# On pull requests that touch the player it builds and smoke-tests them
# and keeps them as run artifacts, for trying before a release.
# publish-player.yml calls it with the release's tag to attach them to
# that GitHub release.
#
# They aren't signed with a paid Apple or Microsoft certificate, so the
# first open needs System Settings › Privacy & Security › Open Anyway on
# a Mac, and More info › Run anyway on Windows (the release notes and
# the Help page say so).

name: Station Player installers

on:
  pull_request:
    paths:
      - 'player/**'
      - '.github/workflows/player-installers.yml'
      - 'scripts/check_macos_minimum.sh'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Attach the installers to this GitHub release
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # gh release upload, when called with a tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 runners retire on 2 November 2026; the app is still
          # built to run on macOS 11 (checked after the build).
          - os: macos-15
            label: Mac (Apple Silicon)
            kind: mac
            arch: apple-silicon
          - os: macos-15-intel
            label: Mac (Intel)
            kind: mac
            arch: intel
          - os: windows-latest
            label: Windows
            kind: windows
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      STATION_PLAYER_HOME: ${{ github.workspace }}/smoke-home
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: tools
        run: |
          python -m pip install "pyinstaller>=6.10,<7" certifi
          # The Mac app's own window (macwindow.py); Quartz only for the check below.
          if [ "${{ matrix.kind }}" = mac ]; then python -m pip install pyobjc-framework-WebKit pyobjc-framework-Quartz; fi

      - name: read version
        id: version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("player/pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: build the app
        run: python -m PyInstaller --noconfirm --clean player/packaging/station-player.spec --distpath build/dist --workpath build/work

      - name: check it still runs on macOS 11
        if: matrix.kind == 'mac'
        run: scripts/check_macos_minimum.sh "build/dist/Station Player.app" 11.0

      - name: smoke-test the app
        run: |
          set -e
          if [ "${{ matrix.kind }}" = mac ]; then
            # The helper that runs the player (the app itself only hands over to it).
            EXE="build/dist/Station Player.app/Contents/MacOS/station-player-server"
          else
            EXE="build/dist/Station Player/Station Player.exe"
          fi
          "$EXE" --no-browser --port 8765 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; echo "--- log"; cat "$STATION_PLAYER_HOME/station-player.log" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/api/state >/dev/null && break
            sleep 1
          done
          curl -sS http://127.0.0.1:8765/api/state | python -c "import json,sys; d=json.load(sys.stdin); assert d['bundled'] and d['version'] == '${{ steps.version.outputs.version }}', d; print('version', d['version'])"
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8765/ | grep -q '^200 text/html'
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8765/help.js | grep -q '^200 text/javascript'
          # The certificates bundled for https (stations, Find stations, updates).
          if [ "${{ matrix.kind }}" = mac ]; then
            test -f "build/dist/Station Player.app/Contents/Resources/certifi/cacert.pem" \
              || test -f "build/dist/Station Player.app/Contents/Frameworks/certifi/cacert.pem"
          fi
          if [ "${{ matrix.kind }}" = mac ]; then
            # The app itself, opened while the player runs, hands over and exits...
            "build/dist/Station Player.app/Contents/MacOS/Station Player" --no-browser --port 8765
            kill $PID; sleep 2
            # ...and with no player running, starts the helper and exits.
            "build/dist/Station Player.app/Contents/MacOS/Station Player" --no-browser --port 8766
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8766/api/state >/dev/null && break; sleep 1; done
            curl -sf http://127.0.0.1:8766/api/state >/dev/null
            pkill -f station-player-server || true
          fi
          echo "smoke OK"

      - name: try the Mac app's own window
        if: matrix.kind == 'mac'
        run: |
          set -e
          pkill -f station-player-server || true
          APP="build/dist/Station Player.app"
          REPORT="$RUNNER_TEMP/selftest.json"
          rm -f "$REPORT"
          plutil -extract LSUIElement raw "$APP/Contents/Info.plist" 2>/dev/null && { echo "the app must have a Dock icon"; exit 1; } || true
          system_profiler SPAudioDataType | grep -E "^ {8}[^ ].*:$|Output Channels" || echo "no sound devices"
          # Opened the way the Finder opens it, so macOS knows it as the app.
          # A music folder with one track, which the check plays.
          MUSIC="$RUNNER_TEMP/Music"
          mkdir -p "$MUSIC"
          python -c "import math, struct, sys, wave; w = wave.open(sys.argv[1], 'wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh', v, v) for v in (int(3000 * math.sin(i / 20)) for i in range(44100 * 3)))); w.close()" "$MUSIC/tone.wav"
          open --env "STATION_PLAYER_SELFTEST=$REPORT" --env "STATION_PLAYER_HOME=$STATION_PLAYER_HOME" "$APP" --args "$MUSIC"
          trap 'pkill -f "Station Player.app/Contents/MacOS/Station Player" || true; pkill -f station-player-server || true; echo "--- log"; cat "$STATION_PLAYER_HOME/station-player.log" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do [ -s "$REPORT" ] && break; sleep 1; done
          echo "page: $(cat "$REPORT" 2>/dev/null)"
          python - "$REPORT" <<'PY'
          import json, sys
          import Quartz
          report = json.load(open(sys.argv[1]))
          assert report["native"] and report["bridge"], report
          assert report["autoplay"] == "played", report  # a track, with no click first
          print("sound without a click:", report["autoplay"])
          assert "StationPlayerApp/" in report["agent"], report
          assert not report["serviceWorker"], report
          wins = Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, Quartz.kCGNullWindowID)
          ours = [w for w in wins if w.get("kCGWindowOwnerName") == "Station Player" and w.get("kCGWindowLayer") == 0]
          print("windows:", [dict(w.get("kCGWindowBounds")) for w in ours])
          assert ours, "no Station Player window on screen"
          b = ours[0]["kCGWindowBounds"]
          open(sys.argv[1] + ".rect", "w").write("%d,%d,%d,%d" % (b["X"], b["Y"], b["Width"], b["Height"]))
          PY
          screencapture -x -R"$(cat "$REPORT.rect")" "$RUNNER_TEMP/window.png"
          mkdir -p shots
          sips -Z 1200 -s format jpeg -s formatOptions 60 "$RUNNER_TEMP/window.png" --out "shots/window-${{ matrix.arch }}.jpg" >/dev/null
          sips -Z 420 -s format jpeg -s formatOptions 30 "$RUNNER_TEMP/window.png" --out "$RUNNER_TEMP/small.jpg" >/dev/null
          echo "screenshot-base64-start"; base64 -i "$RUNNER_TEMP/small.jpg" | tr -d '\n'; echo; echo "screenshot-base64-end"
          # Quit as the menu's Quit does: the player stops and the window app exits.
          osascript -e 'tell application id "io.github.raby.StationPlayer" to quit'
          for i in $(seq 1 30); do pgrep -f "Station Player.app/Contents/MacOS/Station Player" >/dev/null || break; sleep 1; done
          if pgrep -f "Station Player.app/Contents/MacOS/Station Player" >/dev/null; then echo "the app didn't quit"; exit 1; fi
          if curl -sf http://127.0.0.1:8765/api/state >/dev/null; then echo "the player kept running after Quit"; exit 1; fi
          echo "own window OK"

      - uses: actions/upload-artifact@v6
        if: always() && matrix.kind == 'mac'
        with:
          name: station-player-window-${{ matrix.arch }}
          path: shots/*
          retention-days: 7
          if-no-files-found: ignore

      - name: make the .dmg
        if: matrix.kind == 'mac'
        run: |
          set -e
          mkdir -p build/dmg out
          cp -R "build/dist/Station Player.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil sometimes finds the runner's disk busy: try again.
          for i in 1 2 3; do
            hdiutil create -volname "Station Player" -srcfolder build/dmg -ov -format UDZO \
              "out/StationPlayer-${{ steps.version.outputs.version }}-mac-${{ matrix.arch }}.dmg" && break
            sleep 10
          done
          test -f "out/StationPlayer-${{ steps.version.outputs.version }}-mac-${{ matrix.arch }}.dmg"

      - name: make the setup .exe
        if: matrix.kind == 'windows'
        env:
          MSYS_NO_PATHCONV: '1'  # Git Bash would turn ISCC's /D… options into paths
        run: |
          set -e
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          mkdir -p out
          "$ISCC" /DVersion=${{ steps.version.outputs.version }} \
            "/DSource=$(cygpath -w "$PWD/build/dist/Station Player")" \
            "/DOutput=$(cygpath -w "$PWD/out")" \
            "$(cygpath -w "$PWD/player/packaging/windows/installer.iss")"
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: station-player-${{ matrix.kind }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: attach to the release
        if: inputs.release_tag != ''
        run: gh release upload "${{ inputs.release_tag }}" out/* --clobber --repo "$GITHUB_REPOSITORY"
