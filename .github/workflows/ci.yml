name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.14'
          activate-environment: true  # `python` is .venv's
      - name: uv.lock is up to date
        # Fails when a pyproject.toml's dependencies changed without
        # `make lock`, so what CI tests is what the lock says.
        run: uv lock --check
      - name: install
        # Exactly the versions in uv.lock (runtime + dev + docs).
        run: uv sync --locked
      - name: pytest + coverage gate
        run: make test-backend
      - name: alembic ↔ create_all schema parity
        # Catches "added a model class but forgot make alembic-revision"
        # (DESIGN.md §17 review S2). Both produce the same schema from
        # engine/models.py at HEAD; drift = a migration is missing.
        run: make migration-parity

  player:
    name: station-player (pytest)
    runs-on: ubuntu-24.04  # Playwright's Chromium doesn't support ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.12'
          activate-environment: true  # `python` is .venv's
      - name: install
        # Playwright drives the player page in Chromium (tests/test_browser.py).
        # The dev group (uv.lock) also has the annotate plugin, which turns
        # each failing test into an annotation on the run and the PR.
        run: |
          uv sync --locked --package station-player
          python -m playwright install --with-deps chromium
      - name: pytest
        working-directory: player
        env:
          STATION_PLAYER_REQUIRE_BROWSER: '1'
        run: python -m pytest -q

  appkit:
    # What the three apps share: the update check, the self-updater and
    # the app window (appkit/).
    name: station-appkit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.12'
          activate-environment: true  # `python` is .venv's
      - name: install
        run: uv sync --locked --package station-appkit
      - name: pytest
        working-directory: appkit
        run: python -m pytest -q

  server:
    name: station-server (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.12'
          activate-environment: true  # `python` is .venv's
      - name: install
        # ffmpeg does the decoding and encoding; the end-to-end tests need it.
        # A static build from BtbN/FFmpeg-Builds (as in the Windows app), not
        # apt, whose mirror has hung these jobs for half an hour at a time.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          # BtbN rebuilds its "latest" release now and then, and it's missing
          # for a few minutes while it does: try again rather than fail.
          for try in 1 2 3 4 5 6 7 8; do
            gh release download latest --repo BtbN/FFmpeg-Builds --clobber \
              --pattern 'ffmpeg-master-latest-linux64-lgpl.tar.xz' --dir "$RUNNER_TEMP/ffmpeg" && break
            echo "BtbN's latest ffmpeg isn't there just now; trying again in 30 s"
            sleep 30
          done
          tar -xf "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-linux64-lgpl.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-linux64-lgpl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-linux64-lgpl/bin/ffmpeg" -hide_banner -encoders | grep -q libmp3lame
          uv sync --locked --package station-server
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  server-desktop:
    # The same tests on the computers stations actually run on.
    name: station-server (pytest, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          # macOS 14 runners retire on 2 November 2026 (brownouts before).
          - os: macos-15
            label: Mac
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.12'
          activate-environment: true  # `python` is .venv's
      - name: install
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          if [ "$RUNNER_OS" = Windows ]; then
            for try in 1 2 3 4 5 6 7 8; do
              asset=$(gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' \
                | grep -E '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' | sort -V | tail -1) || true
              if [ -n "$asset" ] && gh release download latest --repo BtbN/FFmpeg-Builds --clobber \
                  --pattern "$asset" --dir "$RUNNER_TEMP/ffmpeg"; then
                break
              fi
              echo "BtbN's latest ffmpeg isn't there just now; trying again in 30 s"
              sleep 30
            done
            unzip -q -o "$RUNNER_TEMP/ffmpeg/$asset" -d "$RUNNER_TEMP/ffmpeg"
            bin="$RUNNER_TEMP/ffmpeg/${asset%.zip}/bin"
          else
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg/ffmpeg.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
            unzip -o "$RUNNER_TEMP/ffmpeg/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg/bin"
            chmod +x "$RUNNER_TEMP/ffmpeg/bin/ffmpeg"
            bin="$RUNNER_TEMP/ffmpeg/bin"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/ffmpeg" -hide_banner -encoders | grep -q libmp3lame
          uv sync --locked --package station-server
      - name: pytest
        working-directory: server
        run: python -m pytest -q -p no:cacheprovider
      - name: station-appkit's tests, on this computer too
        # The update check, self-updater and app window it uses (appkit/).
        working-directory: appkit
        run: python -m pytest -q -p no:cacheprovider

  frontend-unit:
    name: frontend unit (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: svelte-check (typecheck + template parse)
        # §14.33 review fix: catches template syntax errors + cross-file
        # type drift that vitest doesn't see (vitest tests against the
        # compiled output). Threshold: error — warnings don't block.
        # §v1.5.0-release CI fix — `npm run check` runs
        # `svelte-kit sync && svelte-check` (per web/package.json).
        # Without `svelte-kit sync`, the auto-generated
        # `.svelte-kit/tsconfig.json` doesn't exist; svelte-check
        # then cascades 221 errors from "$lib/* not resolved"
        # because tsconfig.json extends that missing file.
        working-directory: web
        run: npm run check
      - name: vitest
        run: make test-frontend-unit

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04  # Playwright's Chromium doesn't support ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.14'
          activate-environment: true  # `python` is .venv's
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: install python
        run: uv sync --locked
      - name: install node
        working-directory: web
        run: npm ci
      - name: install chromium
        run: make install-e2e-browsers
      - name: playwright
        run: make test-e2e
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  # §16.13 slice-review 🟡-2: enforce `make wheel-smoke` per PR. The
  # release-blocker framing in CONTRIBUTING.md is aspirational without
  # this — main could otherwise land in a state where the wheel doesn't
  # build cleanly (force-include regression, lifespan import error,
  # SPA mount drift) and no PR check catches it until release time.
  #
  # Docker smoke (`make image-smoke`) is its own workflow,
  # image-smoke.yml: on push to main, and on pull requests that change
  # what goes into the image.
  install-smoke-wheel:
    name: install smoke (wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'  # keep in step with the other workflows
          python-version: '3.12'
          activate-environment: true  # `python` is .venv's
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: install web deps (npm)
        # §v1.5.0-release CI fix — `make wheel` runs `cd web && npm
        # run build` which needs `node_modules/.bin/vite`. Without an
        # explicit `npm ci`, the install-smoke-wheel job fails with
        # `sh: 1: vite: not found` because setup-node only fetches
        # Node + caches npm — it doesn't install packages.
        working-directory: web
        run: npm ci
      - name: install build deps (python)
        # `make wheel` shells out to `$(PY) -m build`, in the dev group.
        run: uv sync --locked
      - name: make wheel-smoke
        # Same target the release process uses locally + that publish.yml
        # consumes. Builds the wheel, installs into a temp venv, starts
        # station-studio serve, curls /, /api/stations, /sources for
        # HTTP-200 + content-type. ~30-60s end-to-end with cached deps.
        run: make wheel-smoke
