# Station Studio app release: the Mac and Windows downloads.
#
# Run it from the Actions tab ("Publish Station Studio app" → Run
# workflow) on main, after bumping the version in pyproject.toml and
# station_studio/__init__.py. It runs the tests, makes a DRAFT GitHub
# release `studio-v<version>`, builds the downloads onto it
# (studio-installers.yml), and only then publishes the release. The
# apps' new-version notice and Update now only ever see published
# releases, so nobody is offered a version whose download isn't there.
#
# If a download job fails (the Apple Silicon runner sometimes sits
# queued until cancelled), use "Re-run failed jobs" on the run: the
# draft is kept and the release is published once they pass.
#
# Tags are `studio-v*`, never `v*`, so this can't trigger publish.yml
# (the PyPI release, which stays tag-driven), and `player-v*` releases
# are Station Player's.

name: Publish Station Studio app

on:
  workflow_dispatch:

concurrency:
  group: publish-studio-app
  cancel-in-progress: false

jobs:
  release:
    name: test, draft GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the draft release
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: read version
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          PKG=$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("station_studio/__init__.py").read())[1])')
          if [ "$VERSION" != "$PKG" ]; then
            echo "ERROR: pyproject.toml says $VERSION but station_studio/__init__.py says $PKG." >&2
            exit 1
          fi
          if gh release view "studio-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release studio-v$VERSION already exists. Bump the version first (or, for a draft left by a failed run, re-run that run's failed jobs)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: create the draft release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cat > notes.md <<NOTES
          Station Studio $VERSION as an app: no terminal, Python or Docker needed.

          **Download** (the files are below, under Assets):

          - **Mac:** \`StationStudio-$VERSION-mac-apple-silicon.dmg\` (Macs from 2020 on with an M chip), or \`-mac-intel.dmg\` for older Macs. Open it and drag Station Studio into Applications, then open it from there. The first time, macOS says it can't check the app: open System Settings › Privacy & Security, scroll down and press **Open Anyway**.
          - **Windows:** \`StationStudio-$VERSION-windows-setup.exe\`. If Windows says it protected your PC, press **More info**, then **Run anyway**. It installs just for you, with no administrator password, and adds Station Studio to the Start menu (and the desktop, if you tick it).

          Opening Station Studio opens it in your browser at http://127.0.0.1:8001. Use **Quit** at the bottom right of the page to stop it. When a newer version is out, the page offers **Update now**.

          Your stations, pools and playlists are kept in the \`.station-studio\` folder in your home folder, which updating and uninstalling leave alone. Exported playlists go in its \`exports\` folder, where Station Player finds them.

          **Moving over from Docker:** your data is in the Docker volume, not that folder. Quit Station Studio and stop Docker's copy (\`docker compose down\`), then copy it across with \`docker run --rm -v station-studio-data:/data -v ~/.station-studio:/dest alpine cp -a /data/. /dest/\` and open Station Studio again.

          NOTES
          gh release create "studio-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Station Studio $VERSION" \
            --notes-file notes.md \
            --draft

  installers:
    name: Mac and Windows downloads
    needs: release
    permissions:
      contents: write  # attach them to the release
    uses: ./.github/workflows/studio-installers.yml
    with:
      release_tag: studio-v${{ needs.release.outputs.version }}

  publish:
    name: publish the release
    needs: [release, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: check every download is there, then publish
        run: |
          set -e
          TAG="studio-v${{ needs.release.outputs.version }}"
          V="${{ needs.release.outputs.version }}"
          FILES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$FILES"
          for f in "StationStudio-$V-mac-apple-silicon.dmg" "StationStudio-$V-mac-intel.dmg" "StationStudio-$V-windows-setup.exe"; do
            echo "$FILES" | grep -qx "$f" || { echo "ERROR: $f is missing" >&2; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
