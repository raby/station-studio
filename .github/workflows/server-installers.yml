# Station Server downloads for people without a terminal: a Mac .dmg
# (Apple Silicon and Intel) and a Windows setup .exe, each carrying its
# own Python and its own ffmpeg (PyInstaller; see
# server/packaging/station-server.spec).
#
# On pull requests that touch the server it builds and smoke-tests them
# and keeps them as run artifacts, for trying before a release.
#
# ffmpeg comes from BtbN/FFmpeg-Builds (Windows, the LGPL build) and
# ffmpeg.martin-riedl.de (Mac); its licence goes in the app beside it.
# The Mac builds are pinned by checksum and kept in this repo's
# ffmpeg-mac-<version> release too: martin-riedl makes no Intel builds
# after January 2027 and may not keep the old ones. To move to a newer
# ffmpeg, change both Mac rows' ffmpeg and ffmpeg_sha256 (the first run
# reports the checksum and martin-riedl's, to check it against).
#
# They aren't signed with a paid Apple or Microsoft certificate, so the
# first open needs System Settings › Privacy & Security › Open Anyway on
# a Mac, and More info › Run anyway on Windows.

name: Station Server installers

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-installers.yml'
      - 'scripts/check_macos_minimum.sh'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Attach the installers to this GitHub release
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # gh release upload, when called with a tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 runners retire on 2 November 2026. The app still runs
          # on the macOS its Info.plist says (checked after the build).
          - os: macos-15
            label: Mac (Apple Silicon)
            kind: mac
            arch: apple-silicon
            # ffmpeg 9.0.2 from ffmpeg.martin-riedl.de, pinned so a
            # rebuild gets the same one (it needs macOS 12). The checksum
            # is of that build's ffmpeg.zip, as martin-riedl publishes it.
            ffmpeg: arm64/1789931890_9.0.2
            ffmpeg_sha256: c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924
          - os: macos-15-intel
            label: Mac (Intel)
            kind: mac
            arch: intel
            ffmpeg: amd64/1789931006_9.0.2
            ffmpeg_sha256: 7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4
          - os: windows-latest
            label: Windows
            kind: windows
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      STATION_SERVER_HOME: ${{ github.workspace }}/smoke-home
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: tools
        run: |
          python -m pip install "pyinstaller>=6.10,<7" certifi ./player
          # The Mac app's own window (macwindow.py); Quartz only for the check below.
          if [ "${{ matrix.kind }}" = mac ]; then python -m pip install pyobjc-framework-WebKit pyobjc-framework-Quartz; fi

      - name: read version
        id: version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("server/pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: get ffmpeg (Mac)
        if: matrix.kind == 'mac'
        env:
          BUILD: ${{ matrix.ffmpeg }}
          WANT: ${{ matrix.ffmpeg_sha256 }}
        run: |
          set -e
          mkdir -p server/packaging/ffmpeg build/ffmpeg
          # Our own copy first, in this repo's ffmpeg-mac-<version> release;
          # martin-riedl's only if it isn't there yet. Either way it must
          # be the pinned build.
          version="${BUILD##*_}"                 # 9.0.2
          mirror="ffmpeg-mac-$version"
          name="ffmpeg-macos-${BUILD/\//-}.zip"  # ffmpeg-macos-amd64-1789931006_9.0.2.zip
          from=
          for try in 1 2 3; do
            code=$(curl -sS -o build/ffmpeg/mirror.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$mirror") || code=000
            # No such release yet, or it hasn't this build: martin-riedl's.
            [ "$code" = 404 ] && break
            if [ "$code" = 200 ]; then
              jq -e --arg n "$name" 'any(.assets[]; .name == $n)' build/ffmpeg/mirror.json >/dev/null || break
              if gh release download "$mirror" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir build/ffmpeg --clobber; then
                from=mirror; break
              fi
            fi
            echo "couldn't get $name from the $mirror release (HTTP $code); trying again"
            sleep 10
          done
          if [ -z "$from" ]; then
            from=martin-riedl
            url="https://ffmpeg.martin-riedl.de/download/macos/$BUILD/ffmpeg.zip"
            curl -fsSL --retry 3 -o "build/ffmpeg/$name" "$url"
            curl -fsSL --retry 3 -o build/ffmpeg/published.sha256 "$url.sha256"
            published=$(awk '{print $1}' build/ffmpeg/published.sha256)
          fi
          got=$(shasum -a 256 "build/ffmpeg/$name" | awk '{print $1}')
          echo "::notice title=ffmpeg $BUILD::sha256 $got, from $from${published:+ (published $published)}"
          # Not `test … && test …`: under set -e a failing first test
          # wouldn't stop the step.
          if [ "$got" != "$WANT" ]; then
            echo "::error title=ffmpeg checksum::$name (from $from) isn't the pinned $BUILD build"
            exit 1
          fi
          if [ "$from" = martin-riedl ] && [ "$published" != "$got" ]; then
            echo "::error title=ffmpeg checksum::martin-riedl publishes ${published:-no checksum} for $BUILD, not the pinned one"
            exit 1
          fi
          # Keep a copy. Never from a pull request's run: those don't write releases.
          if [ "$from" = martin-riedl ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            # Both Mac builds may get here at once: one makes the release.
            gh release create "$mirror" --repo "$GITHUB_REPOSITORY" --target main --prerelease --latest=false \
              --title "ffmpeg $version for Station Server's Mac app" \
              --notes "Not a Station Server release, and please don't delete it: the Mac app's builds take their ffmpeg from here (.github/workflows/server-installers.yml). These are the builds from https://ffmpeg.martin-riedl.de, kept in case they go from there (no Intel builds after January 2027). ffmpeg is licensed under the GNU GPL version 3; its source is at https://ffmpeg.org/download.html." \
              || gh release view "$mirror" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release upload "$mirror" "build/ffmpeg/$name" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          unzip -o "build/ffmpeg/$name" -d build/ffmpeg
          cp build/ffmpeg/ffmpeg server/packaging/ffmpeg/ffmpeg
          chmod +x server/packaging/ffmpeg/ffmpeg
          server/packaging/ffmpeg/ffmpeg -hide_banner -version | head -1
          server/packaging/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libmp3lame
          {
            echo "Station Server uses ffmpeg, from https://ffmpeg.org, built by https://ffmpeg.martin-riedl.de."
            echo "It is licensed under the GNU GPL version 3; its source is at https://ffmpeg.org/download.html."
            echo
            server/packaging/ffmpeg/ffmpeg -hide_banner -version
          } > server/packaging/ffmpeg/LICENSE.txt

      - name: get ffmpeg (Windows)
        if: matrix.kind == 'windows'
        run: |
          set -e
          mkdir -p server/packaging/ffmpeg build/ffmpeg
          # BtbN rebuilds its "latest" release now and then, and it's missing
          # for a few minutes while it does: try again rather than fail.
          for try in 1 2 3 4 5 6 7 8; do
            asset=$(gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' \
              | grep -E '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' | sort -V | tail -1) || true
            if [ -n "$asset" ] && gh release download latest --repo BtbN/FFmpeg-Builds --clobber \
                --pattern "$asset" --dir build/ffmpeg; then
              break
            fi
            echo "BtbN's latest ffmpeg isn't there just now; trying again in 30 s"
            sleep 30
          done
          echo "using $asset"
          unzip -q -o "build/ffmpeg/$asset" -d build/ffmpeg
          dir="build/ffmpeg/${asset%.zip}"
          cp "$dir/bin/ffmpeg.exe" server/packaging/ffmpeg/ffmpeg.exe
          server/packaging/ffmpeg/ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame
          {
            echo "Station Server uses ffmpeg, from https://ffmpeg.org, built by https://github.com/BtbN/FFmpeg-Builds."
            echo "It is licensed under the GNU LGPL; its source is at https://ffmpeg.org/download.html."
            echo
            cat "$dir/LICENSE.txt"
          } > server/packaging/ffmpeg/LICENSE.txt

      - name: build the app
        run: python -m PyInstaller --noconfirm --clean server/packaging/station-server.spec --distpath build/dist --workpath build/work

      - name: check it runs on the macOS it says it does
        if: matrix.kind == 'mac'
        run: scripts/check_macos_minimum.sh "build/dist/Station Server.app"

      - name: smoke-test the app
        run: |
          set -e
          if [ "${{ matrix.kind }}" = mac ]; then
            EXE="build/dist/Station Server.app/Contents/MacOS/station-server-helper"
          else
            EXE="build/dist/Station Server/Station Server.exe"
          fi
          "$EXE" app --no-window --port 8771 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; echo "--- log"; cat "$STATION_SERVER_HOME/station-server.log" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8771/api/state >/dev/null && break
            sleep 1
          done
          # Its own ffmpeg, with the MP3 encoder, and the version built.
          curl -sS http://127.0.0.1:8771/api/state | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['bundled'] and d['version'] == '${{ steps.version.outputs.version }}', d
          assert d['can_update'], d  # Update now works in the downloaded app
          assert d['ffmpeg'] and not d['ffmpeg_error'] and 'ffmpeg' in d['ffmpeg'] and 'Station Server' in d['ffmpeg'], d
          print('version', d['version'], 'ffmpeg', d['ffmpeg'])"
          # It can reach GitHub over https (the Mac app needs its own certificates):
          # anything but a certificate failure will do, a rate limit included.
          CHECK=$(curl -sS -X POST -H 'X-Station-Server: 1' -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:8771/api/update/check)
          if echo "$CHECK" | grep -qi certificate; then echo "update check: $CHECK"; exit 1; fi
          # The certificates bundled for https, as station-studio and station-player check.
          if [ "${{ matrix.kind }}" = mac ]; then
            test -f "build/dist/Station Server.app/Contents/Resources/certifi/cacert.pem" \
              || test -f "build/dist/Station Server.app/Contents/Frameworks/certifi/cacert.pem"
          fi
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8771/ | grep -q '^200 text/html'
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8771/app.js | grep -q '^200 text/javascript'
          # What lets the Dock window start Station Server when it isn't running.
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8771/sw.js | grep -q '^200 text/javascript'
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8771/offline.html | grep -q '^200 text/html'
          if [ "${{ matrix.kind }}" = mac ]; then
            /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' \
              "build/dist/Station Server.app/Contents/Info.plist" | grep -qx station-server
          fi
          if [ "${{ matrix.kind }}" = mac ]; then
            # The app itself, opened while Station Server runs, hands over and exits...
            "build/dist/Station Server.app/Contents/MacOS/Station Server" app --no-window --port 8771
            kill $PID; sleep 2
            # ...and with none running, starts the helper and exits.
            "build/dist/Station Server.app/Contents/MacOS/Station Server" app --no-window --port 8772
            curl -sf http://127.0.0.1:8772/api/state >/dev/null
            pkill -f station-server-helper || true
          fi
          echo "smoke OK"

      - name: try the Mac app's own window
        if: matrix.kind == 'mac'
        run: |
          set -e
          pkill -f station-server-helper || true
          APP="build/dist/Station Server.app"
          REPORT="$RUNNER_TEMP/selftest.json"
          rm -f "$REPORT"
          plutil -extract LSUIElement raw "$APP/Contents/Info.plist" 2>/dev/null && { echo "the app must have a Dock icon"; exit 1; } || true
          # Opened the way the Finder opens it, so macOS knows it as the app.
          open --env "STATION_SERVER_SELFTEST=$REPORT" --env "STATION_SERVER_HOME=$STATION_SERVER_HOME" "$APP"
          trap 'pkill -f "Station Server.app/Contents/MacOS/Station Server" || true; pkill -f station-server-helper || true; echo "--- log"; cat "$STATION_SERVER_HOME/station-server.log" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do [ -s "$REPORT" ] && break; sleep 1; done
          echo "page: $(cat "$REPORT" 2>/dev/null)"
          python - "$REPORT" <<'PY'
          import json, sys
          import Quartz
          report = json.load(open(sys.argv[1]))
          assert report["native"] and report["bridge"], report
          assert report["sidebar"], report
          assert "StationServerApp/" in report["agent"], report
          assert not report["serviceWorker"], report
          wins = Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, Quartz.kCGNullWindowID)
          ours = [w for w in wins if w.get("kCGWindowOwnerName") == "Station Server" and w.get("kCGWindowLayer") == 0]
          print("windows:", [dict(w.get("kCGWindowBounds")) for w in ours])
          assert ours, "no Station Server window on screen"
          b = ours[0]["kCGWindowBounds"]
          open(sys.argv[1] + ".rect", "w").write("%d,%d,%d,%d" % (b["X"], b["Y"], b["Width"], b["Height"]))
          PY
          screencapture -x -R"$(cat "$REPORT.rect")" "$RUNNER_TEMP/window.png"
          mkdir -p shots
          sips -Z 1200 -s format jpeg -s formatOptions 60 "$RUNNER_TEMP/window.png" --out "shots/window-${{ matrix.arch }}.jpg" >/dev/null
          # Quit as the menu's Quit does (nothing on air, so no question): Station Server stops and the window app exits.
          osascript -e 'tell application id "io.github.raby.StationServer" to quit'
          for i in $(seq 1 30); do pgrep -f "Station Server.app/Contents/MacOS/Station Server" >/dev/null || break; sleep 1; done
          if pgrep -f "Station Server.app/Contents/MacOS/Station Server" >/dev/null; then echo "the app didn't quit"; exit 1; fi
          if curl -sf http://127.0.0.1:8770/api/state >/dev/null; then echo "Station Server kept running after Quit"; exit 1; fi
          echo "own window OK"

      - uses: actions/upload-artifact@v6
        if: always() && matrix.kind == 'mac'
        with:
          name: station-server-window-${{ matrix.arch }}
          path: shots/*
          retention-days: 7
          if-no-files-found: ignore

      - name: make the .dmg
        if: matrix.kind == 'mac'
        run: |
          set -e
          mkdir -p build/dmg out
          cp -R "build/dist/Station Server.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil sometimes finds the runner's disk busy: try again.
          for i in 1 2 3; do
            hdiutil create -volname "Station Server" -srcfolder build/dmg -ov -format UDZO \
              "out/StationServer-${{ steps.version.outputs.version }}-mac-${{ matrix.arch }}.dmg" && break
            sleep 10
          done
          test -f "out/StationServer-${{ steps.version.outputs.version }}-mac-${{ matrix.arch }}.dmg"

      - name: make the setup .exe
        if: matrix.kind == 'windows'
        env:
          MSYS_NO_PATHCONV: '1'  # Git Bash would turn ISCC's /D… options into paths
        run: |
          set -e
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          mkdir -p out
          "$ISCC" /DVersion=${{ steps.version.outputs.version }} \
            "/DSource=$(cygpath -w "$PWD/build/dist/Station Server")" \
            "/DOutput=$(cygpath -w "$PWD/out")" \
            "$(cygpath -w "$PWD/server/packaging/windows/installer.iss")"
          ls -la out

      - name: install it, run it and uninstall it (Windows)
        if: matrix.kind == 'windows'
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          set -e
          # As a person would, and as Update now does: a silent install for
          # this user, which then starts the installed app in the background.
          "out/StationServer-${{ steps.version.outputs.version }}-windows-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install.log
          APP="$(cygpath -u "$LOCALAPPDATA")/Programs/Station Server"
          test -f "$APP/Station Server.exe"
          test -f "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Station Server.lnk"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8770/api/state >/dev/null && break
            sleep 1
          done
          curl -sS http://127.0.0.1:8770/api/state | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['version'] == '${{ steps.version.outputs.version }}' and d['ffmpeg'] and not d['ffmpeg_error'], d
          print('installed', d['version'])"
          # Uninstalling stops it and takes it away again.
          "$APP/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          for i in $(seq 1 30); do
            [ ! -f "$APP/Station Server.exe" ] && break
            sleep 1
          done
          test ! -f "$APP/Station Server.exe"
          # Not `! curl …`: under set -e a negated command never stops the step.
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8770/api/state >/dev/null || break
            sleep 1
          done
          if curl -sf http://127.0.0.1:8770/api/state >/dev/null; then
            echo "::error title=uninstall::Station Server kept running after it was uninstalled"
            exit 1
          fi
          echo "install OK"

      - uses: actions/upload-artifact@v6
        with:
          name: station-server-${{ matrix.kind }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: attach to the release
        if: inputs.release_tag != ''
        run: gh release upload "${{ inputs.release_tag }}" out/* --clobber --repo "$GITHUB_REPOSITORY"
