<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Studio</title>
  <meta name="theme-color" content="#0e1013">
  <style>
    :root { --bg: #0e1013; --text: #eef0f3; --muted: #a3aab5; --accent: #f5a524; --accent-text: #1b1204; color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f5f2; --text: #1c1c1a; --muted: #5f5d58; --accent: #9a4f06; --accent-text: #fff; color-scheme: light; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { text-align: center; padding: 24px; max-width: 30em; }
    img { border-radius: 20px; }
    h1 { font-size: 22px; margin: 14px 0 6px; }
    p { color: var(--muted); }
    button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 9px 18px;
      font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="96" height="96">
    <h1>Station Studio</h1>
    <p id="offline-status" role="status">Starting Station Studio…</p>
    <p><button type="button" id="offline-start">Start Station Studio</button></p>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
