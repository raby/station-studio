# §16.13 c1 — packaging config.
#
# Hatchling backend (PEP 621 modern Python standard, zero-config). The
# package is "station-studio" on PyPI but ships THREE top-level modules
# in the wheel: `station_studio` (the CLI entry point), `api` (FastAPI
# routers), and `engine` (the playlist generator). The CLI imports
# from `api` and `engine`; no circular deps.
#
# `scripts/` is intentionally NOT in the wheel — those are in-repo
# developer tools (refresh fixtures, bootstrap-classics, etc), not
# end-user surface. Installed users do the equivalent via the
# `station-studio` CLI subcommands shipping in c1+ (D5 scope: serve +
# import + seed; full list in §16.13.t2 follow-up).
#
# `migrations/` + `alembic.ini` aren't in the wheel YET — c3 wires them
# in via `[tool.hatch.build.targets.wheel.shared-data]` when the
# first-run bootstrap learns to invoke `alembic upgrade head`. For c1
# the wheel just needs to install cleanly + ship the entry point.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "station-studio"
version = "1.19.0"
description = "Open-source playlist generator for hobbyist radio stations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Raby Whyte", email = "rabywhyte@gmail.com" },
]
keywords = ["playlist", "radio", "music", "itunes", "generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

# What the wheel asks for when installed with pip: ranges, so it fits
# beside other packages. The exact versions the apps are built, tested
# and shipped with are pinned in `uv.lock` (see [tool.uv] below).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    # Alembic: the schema migrations in migrations/versions/.
    "alembic>=1.13",
    # FastAPI's Form/File (POST /api/sources/upload) needs it.
    "python-multipart>=0.0.9",
    # The `station-studio` command line.
    "click>=8.1",
]

# Tools for working on Station Studio, not installed with it (PEP 735
# dependency groups: they aren't in the wheel's metadata). `uv sync`
# installs `dev` and `docs`; the installers add `installer`.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # FastAPI's TestClient (Starlette's) sends its requests with httpx2,
    # the maintained fork of httpx; with plain httpx it warns that's
    # deprecated.
    "httpx2>=2.9",
    # `make test-backend`'s --fail-under gate.
    "coverage>=7.10",
    # `make wheel` (python -m build).
    "build>=1.0",
    # In CI, each failing test becomes an annotation on the run and the
    # pull request. Does nothing outside GitHub Actions.
    "pytest-github-actions-annotate-failures>=0.4.2",
]
docs = [
    # The docs site (`make docs-build`). Held to 9.5.x: Material has
    # renamed theme features within minor releases.
    "mkdocs-material>=9.5,<9.6",
    # The API reference page's Swagger UI. Pre-1.0, so held to 0.1.x.
    "mkdocs-render-swagger-plugin>=0.1,<0.2",
]
# The Mac and Windows apps (PyInstaller; packaging/station-studio.spec).
installer = [
    "pyinstaller>=6.10,<7",
    # Certificates for https (the new-version check and updates).
    "certifi",
    # The Mac app's own window (station_studio/macwindow.py); Quartz for
    # scripts/check_macos_minimum.sh.
    "pyobjc-framework-WebKit; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

# The headline shipped artifact: `station-studio <subcommand>` runs
# `station_studio.cli:main`. D5: serve + import + seed in c1; full list
# (generate, export, backup) in the queued §16.13.t2 slice if needed.
[project.scripts]
station-studio = "station_studio.cli:main"

[project.urls]
Homepage = "https://github.com/raby/station-studio"
Repository = "https://github.com/raby/station-studio"
Issues = "https://github.com/raby/station-studio/issues"

# The wheel ships these THREE top-level packages: `api` (FastAPI
# routers), `engine` (playlist generator + seeding library), and
# `station_studio` (the CLI).
#
# §16.13.t9 (closed): `scripts/` was previously over-included so
# `api/main.py:lifespan` could `from scripts.seed_stations import
# ...`. The seeding LIBRARY moved to `engine.seeding`; `scripts/`
# now contains only dev tools (bootstrap_classics,
# dump_weekly_template, generate_byte_eq_fixtures, etc) and is
# deliberately excluded from the wheel. End users never touch
# those tools — moving them out shrinks the wheel and removes the
# "why are dev fixtures shipping?" question.
#
# `scripts/seed_stations.py` survives as a 25-line backward-compat
# shim re-exporting from engine.seeding, so the legacy
# `python -m scripts.seed_stations` invocation keeps working in
# Makefile + Dockerfile contexts where the repo IS checked out.
[tool.hatch.build.targets.wheel]
packages = ["station_studio", "api", "engine"]

# c1-review 🟡-1 + c4: ship bundled data inside the wheel so c3's
# first-run bootstrap + c2's SPA mount + c4's static-asset serving
# all find their data via `importlib.resources.files("station_studio")
# / "_bundled" / ...`. Putting the data INSIDE the package
# (force-include under `station_studio/`) rather than in `share/`
# keeps everything one `importlib.resources` call away — no fragile
# filesystem lookups against `sys.prefix` or distutils-era
# `data_files`.
#
#   stations/    → station_studio/_bundled/stations/   (c1 — D6 first-run copy)
#   migrations/  → station_studio/_bundled/migrations/ (c1 — alembic upgrade head)
#   alembic.ini  → station_studio/_bundled/alembic.ini (c1 — env config)
#   web/build/   → station_studio/_bundled/web/        (c4 — SvelteKit static SPA)
#
# IMPORTANT: `web/build/` only exists AFTER `npm run build` in `web/`.
# `make wheel` runs the frontend build first; `python -m build --wheel`
# alone fails with a clear "directory not found" error if you skip it.
# That's the right behaviour — the wheel without static assets serves
# only the API and gives users a broken UI; failing loud forces the
# correct ordering.
[tool.hatch.build.targets.wheel.force-include]
"stations" = "station_studio/_bundled/stations"
"migrations" = "station_studio/_bundled/migrations"
"alembic.ini" = "station_studio/_bundled/alembic.ini"
"web/build" = "station_studio/_bundled/web"

# Source distribution (sdist) excludes test detritus, the SvelteKit
# frontend (which the wheel will ship as built static assets in c2/c4),
# the dev .venv, and the working DB. The wheel itself is built from
# whatever the sdist contains, so anything excluded here is also out
# of the wheel.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/.coverage",
    "/.pytest_cache",
    "/.svelte-kit",
    "/node_modules",
    "/playwright-test*.db*",
    "/playwright-stations*",
    "/playwright-test*",
    "/test-results",
    "/station_studio.db",
    "/tmp_check.db",
    "/.DS_Store",
    "/web/build",
    "/web/node_modules",
    "/output",
    "/from_user",
    "/backups",
    "/out",
    # Station Player ships as its own package (player/pyproject.toml).
    "/player",
    # The Mac/Windows app recipe (PyInstaller + Inno Setup).
    "/packaging",
]

# §16.13 slice-review 🟡-4 / t3: register the `slow` marker so the
# real-uvicorn subprocess test (tests/test_cli_serve_subprocess.py)
# doesn't trigger a PytestUnknownMarkWarning. Default `pytest` runs
# include slow tests (the gate is the default behavior, not opt-in);
# use `pytest -m 'not slow'` to skip on bandwidth-constrained CI shards.
[tool.pytest.ini_options]
# `player/` is a separate app with its own tests (see player/README.md);
# keep the backend gate scoped to station-studio's own suite.
testpaths = ["tests"]
markers = [
    "slow: subprocess / uvicorn / network tests that add ~5s+ to a run",
]
# A deprecation from Starlette (FastAPI's base) fails the run, so the
# monthly dependency upgrade shows it while it's still a warning, not
# after the release that removes it.
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

# uv: one lock file (uv.lock) for all three apps, so CI, the installers
# and the Docker image get the same versions every time. `make lock`
# after changing a dependency; `make lock-upgrade` to move everything to
# the newest versions the ranges allow. CI fails if uv.lock is out of
# date with these files.
[tool.uv]
required-version = ">=0.13"
default-groups = ["dev", "docs"]
# A new release must be a week old before `make lock-upgrade` takes it:
# a bad or hijacked release is usually pulled within days.
exclude-newer = "7 days"
# The repo root isn't installed into .venv, only its dependencies: the
# code runs from the checkout (as before), and building the package
# needs the web pages built first (web/build, force-included above).
package = false

[tool.uv.workspace]
members = ["player", "server"]
