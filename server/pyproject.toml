# Station Server — plays a station-studio playlist straight to a SHOUTcast
# or Icecast server, replacing the iTunes + loopback cable + Winamp chain.
# Standard library plus station-player (for reading playlists and tags) at
# runtime; ffmpeg does the decoding and encoding.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "station-server"
version = "0.22.0"
description = "Broadcast station-studio playlists to SHOUTcast or Icecast"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Raby Whyte", email = "rabywhyte@gmail.com" },
]
keywords = ["radio", "shoutcast", "icecast", "playout", "itunes", "playlist"]
dependencies = ["station-player>=0.20", "station-appkit>=1.0"]

# For working on it, not installed with it. Versions pinned in the
# repo's uv.lock: `uv sync --package station-server` from the repo root.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
]
installer = [
    "pyinstaller>=6.10,<7",
    "certifi",
    "pyobjc-framework-WebKit; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

# In this repo, station-player is the one beside it (player/), as the
# installers and CI have always used; the published wheel still asks
# PyPI for station-player>=0.20.
[tool.uv.sources]
station-player = { workspace = true }
station-appkit = { workspace = true }

[project.scripts]
station-server = "station_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["station_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
