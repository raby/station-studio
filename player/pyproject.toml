# Station Player — a separate app from station-studio that plays its
# exported iTunes XML playlists, local music folders and radio streams.
# Standard library only at runtime, plus station-appkit (the update check,
# self-updater and app window it shares with Station Studio and Station
# Server, itself standard library only), so `pipx install station-player`
# is the whole install.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "station-player"
version = "0.24.0"
description = "Local music and radio player for station-studio playlists"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Raby Whyte", email = "rabywhyte@gmail.com" },
]
keywords = ["music", "player", "radio", "itunes", "playlist"]
dependencies = ["station-appkit>=1.0"]

# For working on it, not installed with it. Versions pinned in the
# repo's uv.lock: `uv sync --package station-player` from the repo root.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    # tests/test_browser.py drives the page in Chromium.
    "playwright>=1.56,<1.57",
]
# The Mac and Windows apps (PyInstaller; packaging/).
installer = [
    "pyinstaller>=6.10,<7",
    "certifi",
    "pyobjc-framework-WebKit; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

# In this repo, station-appkit is the one in appkit/ (the downloads bundle
# it from there); the published wheel asks PyPI for it.
[tool.uv.sources]
station-appkit = { workspace = true }

[project.scripts]
station-player = "station_player.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["station_player"]

[tool.pytest.ini_options]
testpaths = ["tests"]
