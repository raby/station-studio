<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Player</title>
  <link rel="icon" href="/icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Library">
      <div class="brand"><img src="/icon.png" alt="">Station Player</div>
      <div id="busy" class="busy-note" role="status" hidden>Updating library…</div>
      <div class="lib-search" role="search">
        <span data-icon="search"></span>
        <input type="search" id="lib-search" placeholder="Search library  ( / )" aria-label="Search your whole library" autocomplete="off">
      </div>
      <nav>
        <ul class="nav-list">
          <li><button type="button" class="nav-item" data-view="upnext"><span data-icon="queue"></span><span>Up next</span><span class="count" id="upnext-count"></span></button></li>
        </ul>
        <h2>Playlists</h2>
        <ul id="nav-itunes" class="nav-list"></ul>
        <div class="nav-head"><h2 id="mine-head">My playlists</h2>
          <button type="button" class="nav-add" id="btn-new-playlist" aria-label="New playlist" title="New playlist"><span data-icon="plus"></span></button></div>
        <ul id="nav-mine" class="nav-list" aria-labelledby="mine-head"></ul>
        <h2>Folders</h2>
        <ul id="nav-folders" class="nav-list"></ul>
        <h2>Radio</h2>
        <ul class="nav-list">
          <li><button type="button" class="nav-item" data-view="radio"><span data-icon="radio"></span><span>Stations</span></button></li>
          <li><button type="button" class="nav-item" data-view="recordings"><span data-icon="record"></span><span>Recordings</span></button></li>
        </ul>
        <h2>Clock</h2>
        <ul class="nav-list">
          <li><button type="button" class="nav-item" data-view="clock"><span data-icon="clock"></span><span>Clock &amp; alarms</span><span class="count" id="nav-next-alarm"></span></button></li>
        </ul>
        <div id="rec-status" class="rec-status" hidden></div>
        <h2>Setup</h2>
        <ul class="nav-list">
          <li><button type="button" class="nav-item" id="btn-add-music"><span data-icon="plus"></span><span>Add music</span></button></li>
          <li><button type="button" class="nav-item" data-view="settings"><span data-icon="settings"></span><span>Settings</span></button></li>
          <li><button type="button" class="nav-item" data-view="help"><span data-icon="help"></span><span>Help</span></button></li>
          <li><button type="button" class="nav-item" id="btn-quit"><span data-icon="power"></span><span>Quit Station Player</span></button></li>
        </ul>
      </nav>
      <div id="update" class="update-note" role="status" hidden></div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div id="errors" class="errors" role="alert" hidden></div>
      <section id="view"></section>
    </main>

    <footer class="bar" aria-label="Player">
      <div class="now">
        <img id="now-art" class="now-art" alt="" hidden>
        <div class="now-text">
          <div class="now-title" id="now-title">Nothing playing</div>
          <div class="now-sub" id="now-sub"></div>
        </div>
      </div>
      <div class="controls">
        <div class="buttons">
          <button type="button" id="btn-shuffle" class="icon toggle" aria-pressed="false" title="Shuffle" aria-label="Shuffle"><span data-icon="shuffle"></span></button>
          <button type="button" id="btn-prev" class="icon" title="Previous" aria-label="Previous"><span data-icon="prev"></span></button>
          <button type="button" id="btn-play" class="icon play" title="Play" aria-label="Play"><span data-icon="play"></span></button>
          <button type="button" id="btn-next" class="icon" title="Next" aria-label="Next"><span data-icon="next"></span></button>
          <button type="button" id="btn-repeat" class="icon toggle" aria-pressed="false" title="Repeat: off" aria-label="Repeat: off"><span data-icon="repeat"></span></button>
        </div>
        <div class="seek">
          <span id="time-cur" class="time">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span id="time-dur" class="time">0:00</span>
        </div>
      </div>
      <div class="volume">
        <select id="sleep" class="sleep" aria-label="Sleep timer" title="Sleep timer">
          <option value="">Sleep: off</option>
          <option value="15">Sleep in 15 min</option>
          <option value="30">Sleep in 30 min</option>
          <option value="45">Sleep in 45 min</option>
          <option value="60">Sleep in 1 hour</option>
          <option value="90">Sleep in 1½ hours</option>
          <option value="track">Sleep after this track</option>
        </select>
        <span data-icon="volume"></span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
    </footer>
  </div>
  <div id="track-menu" class="track-menu" role="menu" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <div id="alarm-screen" class="alarm-screen" role="alertdialog" aria-modal="true" aria-labelledby="alarm-screen-title" hidden></div>
  <div id="night" class="night" tabindex="-1" hidden></div>
  <div id="toasts" class="toasts" aria-hidden="true"></div>
  <script src="/help.js"></script>
  <script src="/app.js"></script>
</body>
</html>
