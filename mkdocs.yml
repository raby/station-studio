# §16.15 c1 — MkDocs scaffold. Material theme; content lives in
# `docs/`; build output goes to `site/` (gitignored).
#
# Local workflow: `make docs-serve` (auto-reload at http://127.0.0.1:8000)
# Build: `make docs-build`
# Publish: GitHub Actions (.github/workflows/docs.yml) on push to main.

site_name: Station Studio
site_description: Generative iTunes XML playlists with a visual block editor.
site_author: Raby Whyte
site_url: https://raby.github.io/station-studio/

repo_url: https://github.com/raby/station-studio
repo_name: raby/station-studio
edit_uri: edit/main/docs/

# Strict mode fails the build on broken internal links, missing
# nav entries, etc. Catches drift between mkdocs.yml and the
# files in docs/ before GH Pages goes stale.
strict: true

theme:
  name: material
  language: en
  features:
    # Navigation: top-level tabs + collapsible section nav.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    # Content: code-block tooling, copy button, anchor links.
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    # §16.15 c7 — light + dark palette toggle. Material renders a
    # sun/moon button in the header; choice persists per-visitor
    # via localStorage. Honours `prefers-color-scheme` on first
    # visit via the `media:` query (default browser preference
    # picks the matching scheme on cold load).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    # §16.15 c7 — branded logo. Material includes the radio-tower
    # icon out of the box; no binary asset to ship. The icon
    # renders in the header next to the site_name. Favicon
    # defaults to Material's own (sufficient for v1).
    logo: material/radio-tower

plugins:
  # §16.15 c4-review R9 — once `plugins:` is declared, MkDocs
  # stops implicitly enabling search. KEEP `search` first in
  # this list; a rebase that drops it will silently disable
  # the site search bar (no MkDocs warning).
  - search
  # §16.15 c4 — render Swagger UI inline from the openapi.json
  # dumped by `make docs-openapi`. Plugin reads files referenced
  # by the `!!swagger filename!!` directive in markdown.
  - render_swagger

markdown_extensions:
  # Material's "must-have" set: admonitions for callouts, fenced
  # code blocks with syntax highlighting, footnotes, tables.
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - tables
  - toc:
      permalink: true
  # §16.15 c1-review R1 — `attr_list` powers Material's
  # `:material-...:` icon shortcodes + the `markdown` HTML
  # attribute used by `<div class="grid cards" markdown>`;
  # `md_in_html` lets Python-Markdown descend INTO that div
  # so the inner bullet list is parsed as markdown. Without
  # both, the homepage grid-cards block renders as literal
  # `:material-rocket-launch: **[Tutorial](tutorial.md)** —`
  # text (verified in the committed site/index.html on the
  # initial scaffold build).
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Nav structure is locked at c1 (Home + Tutorial + Reference +
# Architecture top tabs); content fills in across c2-c6 via the
# referenced markdown files. Stubs in docs/tutorial.md /
# docs/reference/index.md / docs/architecture/index.md keep
# `strict: true` happy until each track ships.
nav:
  - Home: index.md
  - Tutorial:
      - tutorial/index.md
  - Reference:
      - reference/index.md
      - Template grammar: reference/template-grammar.md
      - Strategies: reference/strategies.md
      - API: reference/api.md
      - CLI: reference/cli.md
  - Architecture:
      - architecture/index.md
      - Engine pipeline: architecture/engine-pipeline.md
      - Trace versioning: architecture/trace-versioning.md
      - Sidecar + DB-as-truth: architecture/sidecar-db-as-truth.md
      - Live preview: architecture/live-preview.md
      - Test pyramid: architecture/test-pyramid.md
      - Migration policy: architecture/migration-policy.md
